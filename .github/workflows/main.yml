name: Download, Zip and Upload Files

on:
  push:
    branches:
      - Aria
  workflow_dispatch:
    inputs:
      link_url:
        description: 'URL containing magnet/torrent links'
        required: false
        default: ''
      kill_url:
        description: 'Kill switch URL'
        required: false
        default: ''

jobs:
  torrent-processor:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      FOLDER_PATH: 'downloads'
      TORRENT_DIR: 'torrents'
      LINK_FETCH_URL: ${{ github.event.inputs.link_url || 'https://pink-script-snap.lovable.app/api/public/page/e25a8924-a24a-46c6-b875-90ffc5864bbd.txt' }}
      KILL_SWITCH_URL: ${{ github.event.inputs.kill_url || 'https://pink-script-snap.lovable.app/api/public/page/e25a8924-a24a-46c6-b875-90ffc5864bbd.txt' }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full aria2 python3 python3-requests python3-pip curl
          pip3 install --break-system-packages magnet2torrent requests

      - name: Convert Magnets to Torrents
        run: |
          mkdir -p "$FOLDER_PATH" "$TORRENT_DIR"
          python3 - << 'EOF'
          import asyncio
          import os
          import requests
          from magnet2torrent import Magnet2Torrent, FailedToFetchException

          link_url = os.environ.get('LINK_FETCH_URL')
          kill_url = os.environ.get('KILL_SWITCH_URL') or link_url

          async def main():
              if not link_url:
                  print("⚠️ No LINK_FETCH_URL provided.")
                  return

              try:
                  ks = requests.get(link_url, timeout=10).text
                  if "STOP.ALL.TORRENTS" in ks:
                      print("🛑 Global kill switch active.")
                      return
                      
                  for link in ks.splitlines():
                      link = link.strip()
                      if link and not link.startswith('#') and not link.endswith(' NO'):
                          if link.startswith('magnet:'):
                              print(f"📥 Converting magnet using magnet2torrent: {link[:50]}...", flush=True)
                              try:
                                  m2t = Magnet2Torrent(link)
                                  filename, torrent_data = await m2t.retrieve_torrent()
                                  torrent_path = os.path.join(os.environ.get('TORRENT_DIR', 'torrents'), f"{filename}.torrent")
                                  with open(torrent_path, "wb") as f:
                                      f.write(torrent_data)
                                  print(f"✅ Saved torrent: {torrent_path}")
                              except FailedToFetchException:
                                  print("❌ Failed to fetch metadata for magnet link.")
                          elif link.startswith('http'):
                              tor_data = requests.get(link).content
                              target_path = os.path.join(os.environ.get('TORRENT_DIR', 'torrents'), 'temp.torrent')
                              with open(target_path, 'wb') as tf:
                                  tf.write(tor_data)
                              print("✅ Downloaded direct .torrent file.")
              except Exception as e:
                  print(f"Error processing links: {e}")

          asyncio.run(main())
          EOF

      - name: Download Torrents via Concurrent aria2c
        run: |
          python3 - << 'EOF'
          import os
          import glob
          import asyncio

          async def download_torrent(torrent_file, sem, max_retries=3):
              trackers = "udp://tracker.openbittorrent.com:80/announce,udp://tracker.opentrackr.org:1337/announce,udp://tracker.torrent.eu.org:451/announce,udp://exodus.desync.com:6969/announce"
              folder_path = os.environ.get('FOLDER_PATH', 'downloads')
              
              async with sem:
                  for attempt in range(1, max_retries + 1):
                      print(f"📥 [Attempt {attempt}/{max_retries}] Starting: {torrent_file}")
                      cmd = [
                          "aria2c",
                          "--console-log-level=warn",
                          "--summary-interval=0",
                          f"--dir={folder_path}",
                          "--seed-time=0",
                          "--bt-stop-timeout=20",
                          "--timeout=60",
                          "--enable-dht=true",
                          "--enable-peer-exchange=true",
                          "--follow-torrent=mem",
                          f"--bt-tracker={trackers}",
                          torrent_file
                      ]
                      
                      proc = await asyncio.create_subprocess_exec(*cmd)
                      await proc.communicate()
                      
                      if proc.returncode == 0:
                          print(f"✅ Successfully finished: {torrent_file}")
                          return torrent_file
                      else:
                          print(f"⚠️ Timeout/Error on {torrent_file} (Attempt {attempt}). Cleaning control files...")
                          control_file = os.path.join(folder_path, f"{os.path.basename(torrent_file)}.aria2")
                          if os.path.exists(control_file):
                              os.remove(control_file)
                  
                  print(f"❌ Failed all {max_retries} attempts for: {torrent_file}")
                  return None

          async def main():
              torrent_dir = os.environ.get('TORRENT_DIR', 'torrents')
              torrents = glob.glob(f"{torrent_dir}/*.torrent")
              if not torrents:
                  print("⚠️ No torrent files found to download.")
                  return

              os.makedirs(os.environ.get('FOLDER_PATH', 'downloads'), exist_ok=True)
              
              sem = asyncio.Semaphore(8)
              tasks = [download_torrent(t, sem) for t in torrents]
              results = await asyncio.gather(*tasks)
              
              finished = [r for r in results if r]
              print("\n====================")
              print("🎉 FINISHED DOWNLOADS:")
              print("====================")
              for item in finished:
                  print(f"✅ {item}")
              print("====================\n")

          asyncio.run(main())
          EOF

      - name: Smart Auto-Group Zipping & Splitting
        run: |
          python3 - << 'EOF'
          import os, shutil, subprocess, re
          from collections import defaultdict

          folder = os.environ.get('FOLDER_PATH', 'downloads')
          video_ext = ('.mp4', '.mkv', '.avi', '.mov', '.wmv', '.flv', '.webm', '.m4v')
          media_ext = video_ext + ('.srt', '.ass', '.vtt', '.sub')
          max_bytes = 10000 * 1024 * 1024

          def get_dir_size(p):
              return sum(os.path.getsize(os.path.join(dp, f)) for dp, _, fn in os.walk(p) for f in fn)

          def create_7z_group(group_name, file_paths, base_dir, max_bytes_limit):
              group_dir = os.path.join(base_dir, group_name)
              os.makedirs(group_dir, exist_ok=True)
              
              files_to_move = list(file_paths)
              for p in file_paths:
                  base_stem = os.path.splitext(p)[0]
                  for sub_ext in ('.srt', '.ass', '.vtt', '.sub'):
                      sub_file = base_stem + sub_ext
                      if os.path.exists(sub_file) and sub_file not in files_to_move:
                          files_to_move.append(sub_file)

              for p in files_to_move:
                  dst = os.path.join(group_dir, os.path.basename(p))
                  if p != dst and not os.path.exists(dst):
                      shutil.move(p, dst)
              
              folder_size = get_dir_size(group_dir)
              zip_name = f"{group_name}.zip"
              orig = os.getcwd()
              os.chdir(base_dir)
              cmd = ["7z", "a", "-mx0", zip_name, group_name]
              if folder_size > max_bytes_limit:
                  cmd.insert(2, "-v5900m")
              subprocess.run(cmd, check=True)
              os.chdir(orig)
              shutil.rmtree(group_dir)

          if os.path.exists(folder):
              for item in os.listdir(folder):
                  item_path = os.path.join(folder, item)
                  if os.path.isdir(item_path):
                      vids = [
                          os.path.join(r, f) for r, _, files in os.walk(item_path)
                          for f in files if f.lower().endswith(video_ext)
                      ]
                      if len(vids) > 3:
                          print(f"📦 Zipping folder: {item}")
                          folder_size = get_dir_size(item_path)
                          orig = os.getcwd()
                          os.chdir(folder)
                          zip_name = f"{item}.zip"
                          cmd = ["7z", "a", "-mx0", zip_name, item]
                          if folder_size > max_bytes:
                              cmd.insert(2, "-v5900m")
                          subprocess.run(cmd, check=True)
                          os.chdir(orig)
                          shutil.rmtree(item_path)

          remaining_videos = []
          for r, _, files in os.walk(folder):
              for f in files:
                  if f.lower().endswith(video_ext):
                      remaining_videos.append(os.path.join(r, f))

          series_regex = re.compile(r'(?i)^(.*?)[.\s_-]+S(\d{1,2})(?:[EX\-]|\b)')
          def clean_series_name(raw_name):
              return re.sub(r'(?i)(www\.[^\s]+\s*-\s*|^\[.*?\]\s*)', '', raw_name).strip('. -_')

          series_groups = defaultdict(list)
          for vid_path in remaining_videos:
              vid_name = os.path.basename(vid_path)
              parent_name = os.path.basename(os.path.dirname(vid_path))
              match = series_regex.search(vid_name) or series_regex.search(parent_name)
              if match:
                  s_name = clean_series_name(match.group(1))
                  s_num = match.group(2)
                  group_key = f"{s_name.lower()}_S{s_num}"
                  series_groups[group_key].append(vid_path)

          for group_key, vids in series_groups.items():
              if len(vids) > 3:
                  first_stem = os.path.splitext(os.path.basename(vids[0]))[0]
                  create_7z_group(first_stem, vids, folder, max_bytes)
                  for v in vids:
                      if v in remaining_videos:
                          remaining_videos.remove(v)

          if len(remaining_videos) > 3:
              first_stem = os.path.splitext(os.path.basename(remaining_videos[0]))[0]
              create_7z_group(first_stem, remaining_videos, folder, max_bytes)
              remaining_videos.clear()

          for r, dirs, files in os.walk(folder, topdown=False):
              if r == folder: continue
              for f in files:
                  if f.lower().endswith(media_ext):
                    src = os.path.join(r, f)
                    dst = os.path.join(folder, f)
                    if not os.path.exists(dst): 
                        shutil.move(src, dst)
              shutil.rmtree(r, ignore_errors=True)
          EOF

      - name: Upload to Pixeldrain
        env:
          PIXELDRAIN_API_KEY: '0bfe0b11-611d-4bb3-9b4c-36dbaa5a1fd5' # Add your Pixeldrain API key here if you have one
        run: |
          python3 - << 'EOF'
          import os
          import sys
          import subprocess
          import json

          api_key = os.environ.get('PIXELDRAIN_API_KEY', '').strip()
          folder_path = os.environ.get('FOLDER_PATH', 'downloads')

          if not os.path.exists(folder_path):
              print(f"⚠️ Directory '{folder_path}' does not exist.")
              sys.exit(0)

          # Add Basic Auth if API key is provided (-u :API_KEY)
          auth_args = ["-u", f":{api_key}"] if api_key else []

          for root, dirs, files in os.walk(folder_path):
              for filename in files:
                  if any(filename.endswith(ext) for ext in [".!qB", ".part", ".aria2"]):
                      continue
                  
                  # Get absolute path to prevent relative path escaping issues
                  file_path = os.path.abspath(os.path.join(root, filename))
                  file_size_mb = os.path.getsize(file_path) / (1024 * 1024)
                  print(f"\n📤 Uploading to Pixeldrain: {filename} ({file_size_mb:.2f} MB)", flush=True)

                  # Constructing curl command as an array bypasses the shell completely,
                  # safely preserving spaces, brackets [], quotes, and special characters.
                  curl_cmd = [
                      "curl",
                      "--progress-bar",
                      "-X", "POST",
                      "https://pixeldrain.com/api/file",
                      *auth_args,
                      "-H", "Expect:",
                      "-H", "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64)",
                      "-F", f"file=@{file_path}",
                      "--connect-timeout", "30",
                      "--speed-limit", "1024",
                      "--speed-time", "120",
                      "--retry", "3",
                      "--retry-delay", "5"
                  ]

                  result = subprocess.run(curl_cmd, capture_output=True, text=True)
                  res_text = result.stdout + result.stderr

                  if result.returncode == 0:
                      try:
                          res_json = json.loads(result.stdout)
                          if res_json.get("success"):
                              file_id = res_json.get("id")
                              print(f"✅ Successfully uploaded! File Link: https://pixeldrain.com/u/{file_id}", flush=True)
                          else:
                              print(f"❌ Pixeldrain API Error: {res_json.get('message')}", flush=True)
                              sys.exit(1)
                      except json.JSONDecodeError:
                          if '"success":true' in result.stdout.lower():
                              print(f"✅ Successfully uploaded {filename}", flush=True)
                          else:
                              print(f"❌ Unexpected response format:\n{res_text}", flush=True)
                              sys.exit(1)
                  else:
                      print(f"\n❌ Curl Error uploading {filename}:\n{res_text}", flush=True)
                      sys.exit(1)
          EOF
