name: Filester 200MB Test Upload

on:
  push:
    branches: kaycee225-patch-5
    
  workflow_dispatch:

jobs:
  test-upload:
    runs-on: ubuntu-latest
    env:
      FILESTER_API_TOKEN: 'BzPI0ovKXlA7aPM1DXYdbm6MQFAI9rbC'
      FOLDER_PATH: 'downloaded_files'

    steps:
      - uses: actions/checkout@v4
      - name: Install Dependencies
        run: |
          sudo apt update && sudo apt install curl jq python3 python3-requests python3-pip -y
          sudo python3 -m pip install --no-cache-dir --break-system-packages natsort

      - name: Create 200MB Test File
        run: |
          mkdir -p "$FOLDER_PATH"
          echo "Generating 200MB test file for upload verification..."
          dd if=/dev/urandom of="$FOLDER_PATH/test_upload_file.mp4" bs=1M count=200 status=progress

      - name: Upload to Filester
        run: |
          python3 -u - << 'EOF'
          import os
          import subprocess
          import sys
          import time
          from concurrent.futures import ThreadPoolExecutor
          from natsort import natsorted

          FILESTER_API_TOKEN = os.environ.get('FILESTER_API_TOKEN', 'BzPI0ovKXlA7aPM1DXYdbm6MQFAI9rbC')
          FOLDER_PATH = os.environ.get('FOLDER_PATH', 'downloaded_files')
          UPLOAD_URL = "https://u1.filester.me/api/v1/upload"

          def upload_single_file(file_path):
              filename = os.path.basename(file_path)
              file_size_mb = os.path.getsize(file_path) / (1024 * 1024)
              print(f"⬆ [START] Uploading: {filename} ({file_size_mb:.2f} MB)", flush=True)
              
              curl_cmd = [
                  "curl", "-s", "-S", "-X", "POST",
                  UPLOAD_URL,
                  "-H", f"Authorization: Bearer {FILESTER_API_TOKEN}",
                  "-F", f"file=@{file_path}",
                  "--max-time", "3600"
              ]
              
              process = subprocess.Popen(
                  curl_cmd,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.STDOUT,
                  text=True,
                  bufsize=1
              )
              
              output_lines = []
              for line in iter(process.stdout.readline, ''):
                  if line.strip():
                      print(f"📤 [{filename[:20]}]: {line.strip()}", flush=True)
                      output_lines.append(line.strip())
                      
              process.wait()
              
              full_output = " ".join(output_lines)
              if process.returncode == 0:
                  print(f"✅ Finished uploading {filename}: {full_output}", flush=True)
              else:
                  print(f"❌ Curl Error uploading {filename}: {full_output}", flush=True)

          if os.path.exists(FOLDER_PATH):
              upload_queue = []
              for root, dirs, files in os.walk(FOLDER_PATH):
                  for filename in files:
                      if not any(ext in filename for ext in [".!qB", ".part", ".aria2"]):
                          upload_queue.append(os.path.join(root, filename))
              
              upload_queue = natsorted(upload_queue)
              
              if upload_queue:
                  print(f"🚀 Launching parallel upload workers for {len(upload_queue)} files...", flush=True)
                  with ThreadPoolExecutor(max_workers=4) as executor:
                      executor.map(upload_single_file, upload_queue)
          EOF
