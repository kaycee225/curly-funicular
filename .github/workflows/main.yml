name: qBittorrent & Filemirage

on:
  push:
    branches: kaycee225-patch-2
    
  workflow_dispatch:

jobs:
  torrent-upload:
    runs-on: ubuntu-latest
    env:
      FILEMIRAGE_API_TOKEN: '9QQH-DGES-CWQZ-FXNV'
      FOLDER_PATH: 'downloaded_files'
      LINK_FETCH_URL: 'https://fhpsbwpqtteuchtgyqlj.supabase.co/functions/v1/page-download/820a8437-85ed-4543-b789-de53a44f31a6'
      KILL_SWITCH_URL: 'https://fhpsbwpqtteuchtgyqlj.supabase.co/functions/v1/page-download/820a8437-85ed-4543-b789-de53a44f31a6'

    steps:
      - uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt update && sudo apt install qbittorrent-nox jq curl zip p7zip-full python3 python3-requests python3-pip -y
          sudo python3 -m pip install --no-cache-dir --break-system-packages natsort

      - name: Download with qBittorrent & Boxed Progress
        run: |
          mkdir -p "$FOLDER_PATH"
          touch added_links.txt
          mkdir -p ~/.config/qBittorrent
          cat << 'EOF' > ~/.config/qBittorrent/qBittorrent.conf
          [LegalNotice]
          Accepted=true
          [Preferences]
          WebUI\Port=8080
          WebUI\LocalHostAuth=false
          WebUI\AuthSubnetWhitelist=127.0.0.1/32
          WebUI\AuthSubnetWhitelistEnabled=true
          Queueing\QueueEnabled=true
          Queueing\MaxActiveDownloads=10
          Queueing\MaxActiveTorrents=25
          EOF

          qbittorrent-nox -d
          sleep 5

          python3 - << 'EOF'
          import requests, time, os
          from datetime import datetime

          link_url = 'https://fhpsbwpqtteuchtgyqlj.supabase.co/functions/v1/page-download/820a8437-85ed-4543-b789-de53a44f31a6'
          kill_url = 'https://fhpsbwpqtteuchtgyqlj.supabase.co/functions/v1/page-download/820a8437-85ed-4543-b789-de53a44f31a6'
          folder_path = 'downloaded_files'
          absolute_save_path = os.path.abspath(folder_path)
          added_links = set()
          update_count = 0

          def fmt_eta(sec):
              if sec is None or sec < 0 or sec >= 8640000: return "∞"
              m, s = divmod(int(sec), 60); h, m = divmod(m, 60)
              return f"{h}h {m}m {s}s" if h else (f"{m}m {s}s" if m else f"{s}s")

          while True:
              update_count += 1
              timestamp = datetime.now().strftime("%H:%M:%S")

              if kill_url:
                  try:
                      ks = requests.get(kill_url, timeout=5).text
                      if "STOP.ALL.TORRENTS" in ks:
                          print("\n" + "="*50 + f"\n🛑 Global kill switch activated! | {timestamp}\n" + "="*50)
                          break
                      targets = [l.replace(' NO','').strip().lower() for l in ks.splitlines() if l.endswith(' NO') and l.strip()]
                      if targets:
                          res = requests.get('http://127.0.0.1:8080/api/v2/torrents/info').json()
                          for t in res:
                              if any(tg in t['name'].lower() for tg in targets if tg):
                                  requests.post('http://127.0.0.1:8080/api/v2/torrents/delete', data={'hashes': t['hash'], 'deleteFiles': 'true'})
                  except Exception: pass

              if link_url:
                  try:
                      page = requests.get(link_url, timeout=5).text
                      for link in page.splitlines():
                          link = link.strip()
                          if link and not link.startswith('#') and link not in added_links:
                              requests.post('http://127.0.0.1:8080/api/v2/torrents/add', data={'urls': link, 'savepath': absolute_save_path})
                              added_links.add(link)
                  except Exception: pass

              try:
                  res = requests.get('http://127.0.0.1:8080/api/v2/torrents/info').json()
                  print(f"\n" + "="*50)
                  print(f"🔄 Progress Update #{update_count} | {timestamp}")
                  print("-"*50)
                  if not res:
                      print("📥 Waiting for active torrents...")
                      all_done = False
                  else:
                      all_done = True
                      for t in res:
                          prog = int(t.get('progress', 0) * 100)
                          speed_mb = t.get('dlspeed', 0) / (1024 * 1024)
                          eta_str = fmt_eta(t.get('eta', -1))
                          print(f"📥 Torrent: {t['name']} | {prog}% | Speed: {speed_mb:.2f} MB/s | ETA: {eta_str}")
                          if prog < 100: all_done = False
                  print("="*50 + "\n")
                  if all_done and res: break
              except Exception: pass
              time.sleep(10)
          EOF

          pkill qbittorrent-nox || true
          sleep 2

      - name: Smart Zipping & Independent 10GB Splitting
        run: |
          python3 -u - << 'EOF'
          import os, shutil, subprocess, re
          from collections import defaultdict
          from natsort import natsorted

          folder = os.environ.get("FOLDER_PATH", "downloaded_files")
          video_ext = ('.mp4', '.mkv', '.avi', '.mov', '.wmv', '.flv', '.webm', '.m4v')
          media_ext = video_ext + ('.srt', '.ass', '.vtt', '.sub')
          max_bytes = 10000 * 1024 * 1024  # 10 GB limit per independent ZIP file

          def create_independent_zips(group_name, file_paths, base_dir, max_bytes_limit):
              units = []
              seen_files = set()
              file_paths = natsorted(file_paths)
              
              # Pair media files with matching subtitle sidecars
              for p in file_paths:
                  if p in seen_files or not os.path.exists(p):
                      continue
                  unit = [p]
                  seen_files.add(p)
                  
                  base_stem = os.path.splitext(p)[0]
                  for sub_ext in ('.srt', '.ass', '.vtt', '.sub'):
                      sub_file = base_stem + sub_ext
                      if os.path.exists(sub_file) and sub_file not in seen_files:
                          unit.append(sub_file)
                          seen_files.add(sub_file)
                  units.append(unit)

              if not units:
                  return

              # Split into batch groups where size <= max_bytes_limit
              batches = []
              current_batch = []
              current_size = 0

              for unit in units:
                  unit_size = sum(os.path.getsize(f) for f in unit if os.path.exists(f))
                  if current_batch and (current_size + unit_size > max_bytes_limit):
                      batches.append(current_batch)
                      current_batch = []
                      current_size = 0
                      
                  current_batch.extend(unit)
                  current_size += unit_size

              if current_batch:
                  batches.append(current_batch)

              # Build independent standalone .zip archives
              num_batches = len(batches)
              orig_dir = os.getcwd()
              
              safe_group_name = re.sub(r'[\\/*?:"<>|,;]', '_', group_name).strip() or "Batch"

              for idx, batch_files in enumerate(batches):
                  if num_batches == 1:
                      zip_filename = f"{safe_group_name}.zip"
                  else:
                      zip_filename = f"{safe_group_name}_part{idx + 1:02d}.zip"

                  staging_parent = os.path.abspath(os.path.join(base_dir, f"_staging_{safe_group_name}"))
                  staging_dir = os.path.join(staging_parent, safe_group_name)
                  os.makedirs(staging_dir, exist_ok=True)

                  for src in batch_files:
                      if os.path.exists(src):
                          dst = os.path.join(staging_dir, os.path.basename(src))
                          if os.path.abspath(src) != os.path.abspath(dst):
                              shutil.move(src, dst)

                  abs_base_dir = os.path.abspath(base_dir)
                  zip_output_path = os.path.join(abs_base_dir, zip_filename)

                  os.chdir(staging_parent)
                  cmd = ["7z", "a", "-mx0", "-mmt=on", zip_output_path, safe_group_name]
                  
                  try:
                      subprocess.run(cmd, check=True)
                      print(f"📦 Created independent zip: {zip_filename}", flush=True)
                  finally:
                      os.chdir(orig_dir)
                      shutil.rmtree(staging_parent, ignore_errors=True)

          # 1. Zip pre-existing subfolders containing > 3 videos
          if os.path.exists(folder):
              for item in natsorted(os.listdir(folder)):
                  item_path = os.path.join(folder, item)
                  if os.path.isdir(item_path) and not item.startswith('_staging_'):
                      all_files = [os.path.join(r, f) for r, _, files in os.walk(item_path) for f in files]
                      vids = [f for f in all_files if f.lower().endswith(video_ext)]
                      if len(vids) > 3:
                          print(f"📦 Zipping folder directly (> 3 videos): {item}")
                          create_independent_zips(item, all_files, folder, max_bytes)
                          shutil.rmtree(item_path, ignore_errors=True)

          # 2. Gather all remaining video files
          all_videos = []
          for r, _, files in os.walk(folder):
              for f in files:
                  if f.lower().endswith(video_ext):
                      all_videos.append(os.path.join(r, f))

          all_videos = natsorted(all_videos)

          # 3. Detect TV Series (S01, S02, 1x01, etc.)
          series_regex = re.compile(r'(?i)(?:^(.*?)[.\s_-]+)?(?:S(\d{1,2})|\b(\d{1,2})x(\d{1,2})\b)')
          series_groups = defaultdict(list)

          for vid_path in all_videos:
              vid_name = os.path.basename(vid_path)
              parent_name = os.path.basename(os.path.dirname(vid_path))
              match = series_regex.search(vid_name) or series_regex.search(parent_name)
              if match:
                  raw_title = match.group(1) or "Series"
                  s_num = match.group(2) or match.group(3) or "01"
                  group_key = f"{raw_title.strip('. -_').lower()}_S{s_num}"
                  series_groups[group_key].append(vid_path)

          # 4. Zip ONLY TV series season groups containing > 3 videos
          for group_key in natsorted(series_groups.keys()):
              vids = natsorted(series_groups[group_key])
              if len(vids) > 3:
                  first_stem = os.path.splitext(os.path.basename(vids[0]))[0]
                  create_independent_zips(first_stem, vids, folder, max_bytes)

          # Movies and loose videos are explicitly untouched here (NEVER zipped)

          # 5. Move raw movies, remaining videos, and sidecar subtitles to root
          for r, dirs, files in os.walk(folder, topdown=False):
              if r == folder: continue
              for f in natsorted(files):
                  if f.lower().endswith(media_ext):
                      src = os.path.join(r, f)
                      dst = os.path.join(folder, f)
                      if not os.path.exists(dst): 
                          shutil.move(src, dst)
              shutil.rmtree(r, ignore_errors=True)
          EOF

      - name: Parallel Upload to Filemirage
        run: |
          python3 -u - << 'EOF'
          import os
          import re
          import subprocess
          import requests
          import time
          import fcntl
          from concurrent.futures import ThreadPoolExecutor
          from natsort import natsorted

          FILEMIRAGE_API_TOKEN = os.environ.get('FILEMIRAGE_API_TOKEN', '9QQH-DGES-CWQZ-FXNV')
          FOLDER_PATH = os.environ.get('FOLDER_PATH', 'downloaded_files')

          try:
              srv_res = requests.get("https://filemirage.com/api/servers", timeout=10).json()
              SERVER = srv_res['data']['server']
          except Exception as e:
              print(f"Failed to fetch Filemirage server: {e}")
              exit(1)

          def upload_single_file(file_path):
              filename = os.path.basename(file_path)
              
              # Sanitize filenames containing commas or semicolons for curl form compliance
              clean_filename = re.sub(r'[,;]', '_', filename)
              if clean_filename != filename:
                  new_file_path = os.path.join(os.path.dirname(file_path), clean_filename)
                  os.rename(file_path, new_file_path)
                  file_path = new_file_path
                  filename = clean_filename

              file_size_mb = os.path.getsize(file_path) / (1024 * 1024)
              print(f"⬆️ [START] Uploading: {filename} ({file_size_mb:.2f} MB)", flush=True)
              
              curl_cmd = [
                  "curl", "-X", "POST",
                  f"{SERVER}/upload.php",
                  "-H", f"Authorization: Bearer {FILEMIRAGE_API_TOKEN}",
                  "-F", f"file=@{file_path}",
                  "--max-time", "3600"
              ]
              
              proc = subprocess.Popen(curl_cmd, stdout=subprocess.PIPE, stderr=subprocess.PIPE)
              
              fd = proc.stderr.fileno()
              fl = fcntl.fcntl(fd, fcntl.F_GETFL)
              fcntl.fcntl(fd, fcntl.F_SETFL, fl | os.O_NONBLOCK)
              
              last_print_time = time.time()
              buffer = b""
              
              while proc.poll() is None:
                  try:
                      chunk = proc.stderr.read(1024)
                      if chunk:
                          buffer += chunk
                          if b'\r' in buffer or b'\n' in buffer:
                              lines = buffer.replace(b'\r', b'\n').split(b'\n')
                              buffer = lines[-1]
                              valid_lines = [L.decode('utf-8', errors='ignore').strip() for L in lines[:-1] if L.strip()]
                              if valid_lines:
                                  last_line = valid_lines[-1]
                                  if time.time() - last_print_time >= 30:
                                      print(f"📤 Progress [{filename[:25]}]: {last_line}", flush=True)
                                      last_print_time = time.time()
                  except Exception:
                      pass
                  time.sleep(0.5)
                  
              stdout, stderr = proc.communicate()
              if proc.returncode == 0:
                  print(f"✅ Finished uploading {filename}: {stdout.decode('utf-8', errors='ignore').strip()}", flush=True)
              else:
                  err_msg = stderr.decode('utf-8', errors='ignore').strip() if stderr else 'Unknown error'
                  print(f"❌ Curl Error uploading {filename}: {err_msg}", flush=True)

          if os.path.exists(FOLDER_PATH):
              upload_queue = []
              for root, dirs, files in os.walk(FOLDER_PATH):
                  for filename in files:
                      if not any(ext in filename for ext in [".!qB", ".part", ".aria2"]):
                          upload_queue.append(os.path.join(root, filename))
              
              upload_queue = natsorted(upload_queue)
              
              if upload_queue:
                  print(f"🚀 Launching 4 parallel upload workers for {len(upload_queue)} files...", flush=True)
                  with ThreadPoolExecutor(max_workers=4) as executor:
                      executor.map(upload_single_file, upload_queue)
          EOF
