workflows:
  download-zip-upload:
    name: Download Torrent and Upload to Filemirage
    max_build_duration: 120
    instance_type: mac_mini_m1
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true

    scripts:
      - name: Install dependencies
        script: |
          echo "📦 Installing dependencies (7-zip, libtorrent, Python3)..."
          brew update || true
          brew install p7zip libtorrent-rasterbar python3 curl
          pip3 install --no-cache-dir magnet2torrent requests natsort || pip3 install --no-cache-dir --break-system-packages magnet2torrent requests natsort

      - name: Processing links
        script: |
          echo "🧲 Processing links (Converting magnets & Queuing direct links)..."
          mkdir -p downloads torrents 
          python3 - << 'EOF'
          import asyncio
          import os
          import requests
          from urllib.parse import urlparse
          from magnet2torrent import Magnet2Torrent

          link_url = "https://pink-script-snap.lovable.app/api/public/page/0e01cfaf-128c-477f-bff1-9dee23822d97.txt"

          async def main():
              try:
                  ks = requests.get(link_url, timeout=10).text
                  if "STOP.ALL.TORRENTS" in ks:
                      print("🛑 Global kill switch active.")
                      return
                      
                  direct_links = []
                  
                  for i, link in enumerate(ks.splitlines()):
                      link = link.strip()
                      if link and not link.startswith('#') and not link.endswith(' NO'):
                          if link.startswith('magnet:'):
                              print(f"📥 Converting magnet: {link[:60]}...", flush=True)
                              try:
                                  m2t = Magnet2Torrent(link)
                                  filename, torrent_data = await asyncio.wait_for(m2t.retrieve_torrent(), timeout=30)
                                  torrent_path = os.path.join("torrents", f"{filename}.torrent")
                                  with open(torrent_path, "wb") as f:
                                      f.write(torrent_data)
                                  print(f"✅ Saved torrent: {torrent_path}")
                              except Exception as e:
                                  print(f"⚠️ Magnet conversion failed ({e}). Queuing raw magnet for libtorrent fallback!", flush=True)
                                  direct_links.append(link)
                          elif link.startswith('http'):
                              if link.endswith('.torrent'):
                                  try:
                                      tor_data = requests.get(link, timeout=15).content
                                      parsed = urlparse(link)
                                      filename = os.path.basename(parsed.path) or f"download_{i}.torrent"
                                      with open(os.path.join('torrents', filename), 'wb') as tf:
                                          tf.write(tor_data)
                                      print(f"✅ Downloaded .torrent file: {filename}")
                                  except Exception as e:
                                      print(f"❌ Failed to download torrent file ({e}): {link}")
                              else:
                                  direct_links.append(link)
                                  print(f"🔗 Queued direct HTTP download: {link}")
                                  
                  if direct_links:
                      with open('direct_links.txt', 'w') as f:
                          f.write('\n'.join(direct_links))
                          
              except Exception as e:
                  print(f"Error processing links: {e}")

          asyncio.run(main())
          EOF

      - name: Libtorrent downloads
        script: |
          echo "🚀 Starting max-speed concurrent libtorrent downloads..."
          python3 -u - << 'EOF'
          import os
          import glob
          import asyncio
          import time
          import requests
          import libtorrent as lt
          from natsort import natsorted

          def get_best_trackers():
              fallback_trackers = [
                  "udp://tracker.openbittorrent.com:80/announce",
                  "udp://tracker.opentrackr.org:1337/announce",
                  "udp://tracker.torrent.eu.org:451/announce",
                  "udp://exodus.desync.com:6969/announce",
                  "udp://open.stealth.si:80/announce",
                  "udp://tracker.tiny-vps.com:6969/announce",
                  "udp://opentracker.i2p.rocks:6969/announce",
                  "udp://tracker.moeking.me:6969/announce",
                  "https://tracker.foreverpirates.co:443/announce",
                  "udp://tracker.cyberia.is:6969/announce"
              ]
              try:
                  url = "https://raw.githubusercontent.com/ngosang/trackerslist/master/trackers_best.txt"
                  res = requests.get(url, timeout=5)
                  if res.status_code == 200:
                      fetched = [line.strip() for line in res.text.splitlines() if line.strip()]
                      if fetched:
                          print(f"📡 Successfully loaded {len(fetched)} live trackers.", flush=True)
                          return fetched
              except Exception as e:
                  print(f"⚠️ Tracker fetch failed ({e}). Using fallback tracker list.", flush=True)
              return fallback_trackers

          LIVE_TRACKERS = get_best_trackers()
          ses = lt.session({'listen_interfaces': '0.0.0.0:6881'})

          def format_eta(seconds):
              if seconds <= 0: return "Unknown"
              m, s = divmod(int(seconds), 60)
              h, m = divmod(m, 60)
              return f"{h}h {m}m {s}s" if h > 0 else f"{m}m {s}s"

          async def download_target(target, sem, stuck_timeout=25, max_retries=15):
              async with sem:
                  if target.startswith('http') and not target.endswith('.torrent'):
                      print(f"📥 Starting direct HTTP download: {target[:80]}", flush=True)
                      for attempt in range(1, max_retries + 1):
                          try:
                              parsed = requests.utils.urlparse(target)
                              fname = os.path.basename(parsed.path) or f"download_{time.time()}"
                              dest = os.path.join("downloads", fname)
                              with requests.get(target, stream=True, timeout=15) as r:
                                  r.raise_for_status()
                                  total_len = r.headers.get('content-length')
                                  with open(dest, 'wb') as f:
                                      if total_len is None:
                                          for chunk in r.iter_content(chunk_size=8192):
                                              if chunk: f.write(chunk)
                                      else:
                                          dl = 0
                                          total_len = int(total_len)
                                          start_time = time.time()
                                          last_p_time = time.time()
                                          for chunk in r.iter_content(chunk_size=8192):
                                              if chunk:
                                                  dl += len(chunk)
                                                  f.write(chunk)
                                                  cur_time = time.time()
                                                  if cur_time - last_p_time >= 30:
                                                      speed = dl / (cur_time - start_time)
                                                      eta_str = format_eta((total_len - dl) / speed) if speed > 0 else "Unknown"
                                                      pct = (dl / total_len) * 100
                                                      print(f"📊 HTTP Progress [{fname[:30]}]: {pct:.2f}% | Rate: {speed/1024:.1f} KiB/s | ETA: {eta_str}", flush=True)
                                                      last_p_time = cur_time
                              print(f"✅ Successfully finished: {target[:80]}", flush=True)
                              return target
                          except Exception as e:
                              print(f"⚠️ HTTP download failed (Attempt {attempt}): {e}")
                              await asyncio.sleep(2)
                      print(f"❌ Failed all {max_retries} attempts for HTTP: {target[:80]}", flush=True)
                      return None

                  for attempt in range(1, max_retries + 1):
                      print(f"📥 [Attempt {attempt}/{max_retries}] Starting torrent: {target[:80]}", flush=True)
                      
                      handle = None
                      try:
                          if target.startswith('magnet:'):
                              params = lt.parse_magnet_uri(target)
                              params.save_path = 'downloads'
                              handle = ses.add_torrent(params)
                          else:
                              info = lt.torrent_info(target)
                              params = {'save_path': 'downloads', 'ti': info}
                              handle = ses.add_torrent(params)
                              
                          for tr in LIVE_TRACKERS:
                              handle.add_tracker({'url': tr})
                              
                          download_started = False
                          start_time = time.time()
                          last_print_time = time.time()
                          
                          while True:
                              s = handle.status()
                              if s.is_seed:
                                  break
                                  
                              if not s.has_metadata:
                                  pass 
                              elif s.download_payload_rate > 0 and not download_started:
                                  download_started = True
                                  print(f"🚀 Download started active transfer for: {s.name or os.path.basename(target)}", flush=True)
                                  
                              current_time = time.time()
                              if current_time - last_print_time >= 30:
                                  state_str = ['queued', 'checking', 'download metadata', 'downloading', 'finished', 'seeding', 'allocating', 'checking fastresume']
                                  state_name = state_str[s.state] if s.state < len(state_str) else "unknown"
                                  
                                  rate = s.download_payload_rate
                                  if rate > 0:
                                      rem_bytes = s.total_wanted - s.total_wanted_done
                                      eta_str = format_eta(rem_bytes / rate)
                                  else:
                                      eta_str = "Unknown"
                                      
                                  prog = s.progress * 100
                                  name = s.name or "metadata_pending"
                                  print(f"📊 Torrent Progress [{name[:30]}]: {prog:.2f}% | Rate: {rate/1024:.1f} KiB/s | ETA: {eta_str} | Peers: {s.num_peers} | State: {state_name}", flush=True)
                                  last_print_time = current_time
                                  
                              elapsed = time.time() - start_time
                              if not download_started and elapsed > stuck_timeout:
                                  print(f"⏱️ Stuck at 0% for {stuck_timeout}s. Terminating attempt {attempt}...", flush=True)
                                  break
                                  
                              await asyncio.sleep(2)
                              
                          if handle.status().is_seed:
                              print(f"✅ Successfully finished: {target[:80]}", flush=True)
                              ses.remove_torrent(handle)
                              return target
                              
                      except Exception as e:
                          print(f"⚠️ Error on {target[:80]} (Attempt {attempt}): {e}", flush=True)
                          
                      if handle:
                          ses.remove_torrent(handle)
                          
                  print(f"❌ Failed all {max_retries} attempts for: {target[:80]}", flush=True)
                  return None

          async def main():
              targets = natsorted(glob.glob("torrents/*.torrent"))
              
              if os.path.exists("direct_links.txt"):
                  with open("direct_links.txt", "r") as f:
                      links = [line.strip() for line in f if line.strip()]
                      targets.extend(natsorted(links))
                      
              if not targets:
                  print("⚠️ No torrents or links found to download.")
                  return

              os.makedirs("downloads", exist_ok=True)
              sem = asyncio.Semaphore(16)
              tasks = [download_target(t, sem) for t in targets]
              results = await asyncio.gather(*tasks)
              finished = [r for r in results if r]
              
              print("\n====================")
              print("🎉 FINISHED DOWNLOADS:")
              print("====================")
              for item in finished:
                  print(f"✅ {item[:80]}")
              print("====================\n")

          asyncio.run(main())
          EOF

      - name: Zip files
        script: |
          echo "📦 Running Multi-Threaded Smart Auto-Group Zipping & Splitting..."
          python3 - << 'EOF'
          import os, shutil, subprocess, re
          from collections import defaultdict
          from natsort import natsorted

          folder = "downloads"
          video_ext = ('.mp4', '.mkv', '.avi', '.mov', '.wmv', '.flv', '.webm', '.m4v')
          media_ext = video_ext + ('.srt', '.ass', '.vtt', '.sub')
          max_bytes = 10000 * 1024 * 1024

          def get_dir_size(p):
              return sum(os.path.getsize(os.path.join(dp, f)) for dp, _, fn in os.walk(p) for f in fn)

          def create_7z_group(group_name, file_paths, base_dir, max_bytes_limit):
              group_dir = os.path.join(base_dir, group_name)
              os.makedirs(group_dir, exist_ok=True)
              
              files_to_move = list(file_paths)
              for p in file_paths:
                  base_stem = os.path.splitext(p)[0]
                  for sub_ext in ('.srt', '.ass', '.vtt', '.sub'):
                      sub_file = base_stem + sub_ext
                      if os.path.exists(sub_file) and sub_file not in files_to_move:
                          files_to_move.append(sub_file)

              for p in files_to_move:
                  dst = os.path.join(group_dir, os.path.basename(p))
                  if p != dst and not os.path.exists(dst):
                      shutil.move(p, dst)
              
              folder_size = get_dir_size(group_dir)
              zip_name = f"{group_name}.zip"
              orig = os.getcwd()
              os.chdir(base_dir)
              cmd = ["7z", "a", "-mx0", "-mmt=on", zip_name, group_name]
              if folder_size > max_bytes_limit:
                  cmd.insert(2, "-v5900m")
              subprocess.run(cmd, check=True)
              os.chdir(orig)
              shutil.rmtree(group_dir)

          if os.path.exists(folder):
              for item in natsorted(os.listdir(folder)):
                  item_path = os.path.join(folder, item)
                  if os.path.isdir(item_path):
                      vids = natsorted([
                          os.path.join(r, f) for r, _, files in os.walk(item_path)
                          for f in files if f.lower().endswith(video_ext)
                      ])
                      if len(vids) > 3:
                          print(f"📦 Zipping folder: {item}")
                          folder_size = get_dir_size(item_path)
                          orig = os.getcwd()
                          os.chdir(folder)
                          zip_name = f"{item}.zip"
                          cmd = ["7z", "a", "-mx0", "-mmt=on", zip_name, item]
                          if folder_size > max_bytes:
                              cmd.insert(2, "-v5900m")
                          subprocess.run(cmd, check=True)
                          os.chdir(orig)
                          shutil.rmtree(item_path)

          all_videos = []
          for r, _, files in os.walk(folder):
              for f in files:
                  if f.lower().endswith(video_ext):
                      all_videos.append(os.path.join(r, f))

          all_videos = natsorted(all_videos)

          series_regex = re.compile(r'(?i)(?:^(.*?)[.\s_-]+)?S(\d{1,2})(?:[EX\-]|\b)')
          
          series_groups = defaultdict(list)
          unmatched_videos = []

          for vid_path in all_videos:
              vid_name = os.path.basename(vid_path)
              parent_name = os.path.basename(os.path.dirname(vid_path))
              match = series_regex.search(vid_name) or series_regex.search(parent_name)
              
              if match:
                  raw_title = match.group(1) or "Season"
                  s_num = match.group(2)
                  group_key = f"{raw_title.strip('. -_').lower()}_S{s_num}"
                  series_groups[group_key].append(vid_path)
              else:
                  unmatched_videos.append(vid_path)

          for group_key in natsorted(series_groups.keys()):
              vids = natsorted(series_groups[group_key])
              if len(vids) > 3:
                  first_stem = os.path.splitext(os.path.basename(vids[0]))[0]
                  create_7z_group(first_stem, vids, folder, max_bytes)
              else:
                  unmatched_videos.extend(vids)

          unmatched_videos = natsorted(unmatched_videos)

          if len(unmatched_videos) > 3:
              first_stem = os.path.splitext(os.path.basename(unmatched_videos[0]))[0]
              create_7z_group(f"Batch_{first_stem}", unmatched_videos, folder, max_bytes)

          for r, dirs, files in os.walk(folder, topdown=False):
              if r == folder: continue
              for f in natsorted(files):
                  if f.lower().endswith(media_ext):
                      src = os.path.join(r, f)
                      dst = os.path.join(folder, f)
                      if not os.path.exists(dst): 
                          shutil.move(src, dst)
              shutil.rmtree(r, ignore_errors=True)
          EOF

      - name: Upload to Filemirage
        script: |
          echo "📤 Running Parallel Multi-Threaded Uploads to Filemirage..."
          python3 - << 'EOF'
          import os
          import subprocess
          import requests
          import time
          import fcntl
          from concurrent.futures import ThreadPoolExecutor
          from natsort import natsorted

          FILEMIRAGE_API_TOKEN = '9QQH-DGES-CWQZ-FXNV'
          FOLDER_PATH = 'downloads'

          try:
              srv_res = requests.get("https://filemirage.com/api/servers", timeout=10).json()
              SERVER = srv_res['data']['server']
          except Exception as e:
              print(f"Failed to fetch Filemirage server: {e}")
              exit(1)

          def upload_single_file(file_path):
              filename = os.path.basename(file_path)
              file_size_mb = os.path.getsize(file_path) / (1024 * 1024)
              print(f"⬆️ [START] Uploading: {filename} ({file_size_mb:.2f} MB)", flush=True)
              
              curl_cmd = [
                  "curl", "-X", "POST",
                  f"{SERVER}/upload.php",
                  "-H", f"Authorization: Bearer {FILEMIRAGE_API_TOKEN}",
                  "-F", f"file=@{file_path}",
                  "--max-time", "3600"
              ]
              
              proc = subprocess.Popen(curl_cmd, stdout=subprocess.PIPE, stderr=subprocess.PIPE)
              
              fd = proc.stderr.fileno()
              fl = fcntl.fcntl(fd, fcntl.F_GETFL)
              fcntl.fcntl(fd, fcntl.F_SETFL, fl | os.O_NONBLOCK)
              
              last_print_time = time.time()
              buffer = b""
              
              while proc.poll() is None:
                  try:
                      chunk = proc.stderr.read(1024)
                      if chunk:
                          buffer += chunk
                          if b'\r' in buffer or b'\n' in buffer:
                              lines = buffer.replace(b'\r', b'\n').split(b'\n')
                              buffer = lines[-1]
                              valid_lines = [L.decode('utf-8', errors='ignore').strip() for L in lines[:-1] if L.strip()]
                              if valid_lines:
                                  last_line = valid_lines[-1]
                                  if time.time() - last_print_time >= 30:
                                      parts = last_line.split()
                                      if len(parts) >= 11 and parts[0].replace('.','',1).isdigit():
                                          pct = parts[0] + "%"
                                          speed = parts[7]
                                          eta = parts[10]
                                          print(f"📤 Upload Progress [{filename[:25]}]: {pct} | Speed: {speed} | ETA: {eta}", flush=True)
                                      else:
                                          print(f"📤 Upload Progress [{filename[:25]}]: {last_line}", flush=True)
                                      last_print_time = time.time()
                  except Exception:
                      pass
                  time.sleep(0.5)
                  
              stdout, stderr = proc.communicate()
              if proc.returncode == 0:
                  print(f"✅ Finished uploading {filename}: {stdout.decode('utf-8', errors='ignore').strip()}", flush=True)
              else:
                  err_msg = stderr.decode('utf-8', errors='ignore').strip() if stderr else 'Unknown error'
                  print(f"❌ Curl Error uploading {filename}: {err_msg}", flush=True)

          if os.path.exists(FOLDER_PATH):
              upload_queue = []
              for root, dirs, files in os.walk(FOLDER_PATH):
                  for filename in files:
                      if not any(ext in filename for ext in [".!qB", ".part", ".aria2"]):
                          upload_queue.append(os.path.join(root, filename))
              
              upload_queue = natsorted(upload_queue)
              
              if upload_queue:
                  print(f"🚀 Launching 4 parallel upload workers for {len(upload_queue)} files...", flush=True)
                  with ThreadPoolExecutor(max_workers=4) as executor:
                      executor.map(upload_single_file, upload_queue)
          EOF
