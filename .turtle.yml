version: 1
pipeline:
  install_dependencies:
    image: ubuntu:22.04
    commands:
      - apt update
      - apt install -y p7zip-full aria2 python3 python3-requests python3-pip curl
      - pip3 install --break-system-packages magnet2torrent requests

  process_links:
    image: ubuntu:22.04
    commands:
      - mkdir -p downloads torrents
      - |
        python3 - << 'EOF'
        import asyncio
        import os
        import requests
        from urllib.parse import urlparse
        from magnet2torrent import Magnet2Torrent, FailedToFetchException

        link_url = "https://pink-script-snap.lovable.app/api/public/page/720f8d20-7f76-4c56-a532-6cf97fd3fefa.txt"

        async def main():
            try:
                ks = requests.get(link_url, timeout=10).text
                if "STOP.ALL.TORRENTS" in ks:
                    print("🛑 Global kill switch active.")
                    return
                    
                direct_links = []
                for i, link in enumerate(ks.splitlines()):
                    link = link.strip()
                    if link and not link.startswith('#') and not link.endswith(' NO'):
                        if link.startswith('magnet:'):
                            print(f"📥 Converting magnet: {link[:50]}...", flush=True)
                            try:
                                m2t = Magnet2Torrent(link)
                                filename, torrent_data = await m2t.retrieve_torrent()
                                torrent_path = os.path.join("torrents", f"{filename}.torrent")
                                with open(torrent_path, "wb") as f:
                                    f.write(torrent_data)
                                print(f"✅ Saved torrent: {torrent_path}")
                            except FailedToFetchException:
                                print(f"❌ Failed to fetch metadata for magnet link.")
                        elif link.startswith('http'):
                            if link.endswith('.torrent'):
                                tor_data = requests.get(link).content
                                parsed = urlparse(link)
                                filename = os.path.basename(parsed.path) or f"download_{i}.torrent"
                                with open(os.path.join('torrents', filename), 'wb') as tf:
                                    tf.write(tor_data)
                                print(f"✅ Downloaded .torrent file: {filename}")
                            else:
                                direct_links.append(link)
                                print(f"🔗 Queued direct HTTP download: {link}")
                                
                if direct_links:
                    with open('direct_links.txt', 'w') as f:
                        f.write('\n'.join(direct_links))
            except Exception as e:
                print(f"Error processing links: {e}")

        asyncio.run(main())
        EOF

  download_aria2:
    image: ubuntu:22.04
    commands:
      - |
        python3 - << 'EOF'
        import os, glob, asyncio, re, time

        async def download_target(target, sem, stuck_timeout=90, max_retries=3):
            trackers = "udp://tracker.openbittorrent.com:80/announce,udp://tracker.opentrackr.org:1337/announce,udp://tracker.torrent.eu.org:451/announce,udp://exodus.desync.com:6969/announce"
            async with sem:
                for attempt in range(1, max_retries + 1):
                    print(f"📥 [Attempt {attempt}/{max_retries}] Starting: {target[:80]}", flush=True)
                    cmd = [
                        "aria2c", "--console-log-level=notice", "--summary-interval=5",
                        "--dir=downloads", "--seed-time=0", "--file-allocation=none",
                        "--enable-dht=true", "--enable-peer-exchange=true",
                        "--follow-torrent=mem", f"--bt-tracker={trackers}", target
                    ]
                    proc = await asyncio.create_subprocess_exec(*cmd, stdout=asyncio.subprocess.PIPE, stderr=asyncio.subprocess.STDOUT)
                    download_started = False
                    start_time = time.time()
                    
                    while proc.returncode is None:
                        try:
                            line = await asyncio.wait_for(proc.stdout.readline(), timeout=2.0)
                            if not line: break
                            line_str = line.decode('utf-8', errors='ignore').strip()
                            
                            if line_str:
                                print(f"[{os.path.basename(target)[:20]}] {line_str}", flush=True)
                                
                            if not download_started:
                                match = re.search(r'\[#\w+\s+([0-9\.]+)([KMGTP]?i?B)/', line_str)
                                if match and float(match.group(1)) > 0:
                                    download_started = True
                                    print(f"🚀 Download active transfer: {os.path.basename(target)}", flush=True)
                            if not download_started and (time.time() - start_time) > stuck_timeout:
                                print(f"⏱️ Stuck at 0% for {stuck_timeout}s. Terminating...", flush=True)
                                proc.kill()
                                break
                        except asyncio.TimeoutError:
                            if not download_started and (time.time() - start_time) > stuck_timeout:
                                print(f"⏱️ Stuck at 0% for {stuck_timeout}s. Terminating...", flush=True)
                                proc.kill()
                                break
                    await proc.wait()
                    if proc.returncode == 0:
                        print(f"✅ Finished: {target[:80]}", flush=True)
                        return target
            return None

        async def main():
            targets = glob.glob("torrents/*.torrent")
            if os.path.exists("direct_links.txt"):
                with open("direct_links.txt", "r") as f:
                    targets.extend([line.strip() for line in f if line.strip()])
            if not targets: return
            os.makedirs("downloads", exist_ok=True)
            sem = asyncio.Semaphore(8)
            await asyncio.gather(*[download_target(t, sem) for t in targets])

        asyncio.run(main())
        EOF

  zip_and_split:
    image: ubuntu:22.04
    commands:
      - |
        python3 - << 'EOF'
        import os, shutil, subprocess, re
        from collections import defaultdict

        folder = "downloads"
        video_ext = ('.mp4', '.mkv', '.avi', '.mov', '.wmv', '.flv', '.webm', '.m4v')
        media_ext = video_ext + ('.srt', '.ass', '.vtt', '.sub')
        max_bytes = 10000 * 1024 * 1024

        def get_dir_size(p):
            return sum(os.path.getsize(os.path.join(dp, f)) for dp, _, fn in os.walk(p) for f in fn)

        def create_7z_group(group_name, file_paths, base_dir, max_bytes_limit):
            group_dir = os.path.join(base_dir, group_name)
            os.makedirs(group_dir, exist_ok=True)
            for p in file_paths:
                dst = os.path.join(group_dir, os.path.basename(p))
                if p != dst and not os.path.exists(dst): shutil.move(p, dst)
            folder_size = get_dir_size(group_dir)
            zip_name = f"{group_name}.zip"
            orig = os.getcwd()
            os.chdir(base_dir)
            cmd = ["7z", "a", "-mx0", zip_name, group_name]
            if folder_size > max_bytes_limit: cmd.insert(2, "-v5900m")
            subprocess.run(cmd, check=True)
            os.chdir(orig)
            shutil.rmtree(group_dir)

        if os.path.exists(folder):
            all_videos = [os.path.join(r, f) for r, _, files in os.walk(folder) for f in files if f.lower().endswith(video_ext)]
            if len(all_videos) > 3:
                first_stem = os.path.splitext(os.path.basename(all_videos[0]))[0]
                create_7z_group(first_stem, all_videos, folder, max_bytes)
        EOF

  upload_filemirage:
    image: ubuntu:22.04
    environment:
      FILEMIRAGE_API_TOKEN: "9QQH-DGES-CWQZ-FXNV"
    commands:
      - |
        python3 - << 'EOF'
        import os, subprocess, requests

        token = os.getenv('FILEMIRAGE_API_TOKEN')
        folder = 'downloads'

        try:
            srv_res = requests.get("https://filemirage.com/api/servers", timeout=10).json()
            server = srv_res['data']['server']
        except Exception as e:
            print(f"Server fetch failed: {e}")
            exit(1)

        if os.path.exists(folder):
            for root, _, files in os.walk(folder):
                for filename in files:
                    if any(ext in filename for ext in [".!qB", ".part", ".aria2"]): continue
                    file_path = os.path.join(root, filename)
                    print(f"⬆️ Uploading: {filename}")
                    curl_cmd = [
                        "curl", "-s", "-S", "-X", "POST", f"{server}/upload.php",
                        "-H", f"Authorization: Bearer {token}",
                        "-F", f"file=@{file_path}", "--max-time", "3600"
                    ]
                    result = subprocess.run(curl_cmd, capture_output=True, text=True)
                    print(f"Response: {result.stdout}")
        EOF
