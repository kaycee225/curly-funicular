              print(f"📡 Uploading to server: {SERVER}", flush=True)
          except Exception as e:
              print(f"❌ Failed to fetch Filemirage server: {e}", flush=True)
              exit(1)

          def upload_single_file(file_path):
              filename = os.path.basename(file_path)
              size_mb = os.path.getsize(file_path) / (1024 * 1024)
              print(f"⬆️ [START] Uploading {filename} ({size_mb:.2f} MB)...", flush=True)
              curl_cmd = [
                  "curl", "-#", "-X", "POST",
