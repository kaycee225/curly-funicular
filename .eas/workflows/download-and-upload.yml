                  "-H", f"Authorization: Bearer {FILEMIRAGE_API_TOKEN}",
                  "-F", f"file=@{file_path}",
                  "--max-time", "3600"
              ]
              proc = subprocess.Popen(curl_cmd, stderr=subprocess.PIPE, stdout=subprocess.PIPE)
              while proc.poll() is None:
                  time.sleep(3)
                  if proc.poll() is None:
                      print(f"   ⏳ Uploading in progress: {filename}", flush=True)
              stdout, stderr = proc.communicate()
              if proc.returncode == 0:
                  print(f"✅ Uploaded {filename}", flush=True)
              else:
                  print(f"❌ Upload failed for {filename}", flush=True)

          if os.path.exists(FOLDER_PATH):
