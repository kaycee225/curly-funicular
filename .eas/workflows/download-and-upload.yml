name: Download Torrent and Upload to Filemirage

jobs:
  download_zip_upload:
    name: Download, Zip and Upload Files
    steps:
      - uses: eas/checkout

      - name: Install System Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq p7zip-full aria2 python3 python3-requests python3-pip curl

      - name: Install Python Packages
        run: |
          pip3 install --no-cache-dir magnet2torrent requests

      - name: Process Torrent & HTTP Links
        run: |
          mkdir -p downloads torrents 
          python3 - << 'EOF'
          import asyncio, os, requests
          from urllib.parse import urlparse
          from magnet2torrent import Magnet2Torrent

          link_url = "https://pink-script-snap.lovable.app/api/public/page/0e01cfaf-128c-477f-bff1-9dee23822d97.txt"

          async def main():
              try:
                  ks = requests.get(link_url, timeout=10).text
                  if "STOP.ALL.TORRENTS" in ks:
                      print("🛑 Global kill switch active.")
                      return
                  direct_links = []
                  for i, link in enumerate(ks.splitlines()):
                      link = link.strip()
                      if link and not link.startswith('#') and not link.endswith(' NO'):
                          if link.startswith('magnet:'):
                              try:
                                  m2t = Magnet2Torrent(link)
                                  filename, torrent_data = await asyncio.wait_for(m2t.retrieve_torrent(), timeout=30)
                                  torrent_path = os.path.join("torrents", f"{filename}.torrent")
                                  with open(torrent_path, "wb") as f:
                                      f.write(torrent_data)
                              except Exception as e:
                                  direct_links.append(link)
                          elif link.startswith('http'):
                              if link.endswith('.torrent'):
                                  try:
                                      tor_data = requests.get(link, timeout=15).content
                                      parsed = urlparse(link)
                                      filename = os.path.basename(parsed.path) or f"download_{i}.torrent"
                                      with open(os.path.join('torrents', filename), 'wb') as tf:
                                          tf.write(tor_data)
                                  except Exception as e:
                                      pass
                              else:
                                  direct_links.append(link)
                  if direct_links:
                      with open('direct_links.txt', 'w') as f:
                          f.write('\n'.join(direct_links))
              except Exception as e:
                  print(f"Error: {e}")

          asyncio.run(main())
          EOF

      - name: Download Files with Aria2
        run: |
          python3 -u - << 'EOF'
          import os, glob, asyncio, re, time, requests

          def get_best_trackers():
              fallback_trackers = [
                  "udp://tracker.openbittorrent.com:80/announce",
                  "udp://tracker.opentrackr.org:1337/announce",
                  "udp://tracker.torrent.eu.org:451/announce",
                  "udp://exodus.desync.com:6969/announce"
              ]
              try:
                  url = "https://raw.githubusercontent.com/ngosang/trackerslist/master/trackers_best.txt"
                  res = requests.get(url, timeout=5)
                  if res.status_code == 200:
                      fetched = [line.strip() for line in res.text.splitlines() if line.strip()]
                      if fetched: return ",".join(fetched)
              except Exception: pass
              return ",".join(fallback_trackers)

          LIVE_TRACKERS = get_best_trackers()

          async def download_target(target, sem, stuck_timeout=20, max_retries=5):
              async with sem:
                  for attempt in range(1, max_retries + 1):
                      cmd = [
                          "aria2c", "--console-log-level=notice", "--summary-interval=2",
                          "--dir=downloads", "--seed-time=0", "--file-allocation=none",
                          "--enable-dht=true", "--enable-peer-exchange=true", "--follow-torrent=mem",
                          "-s16", "-x16", "--min-split-size=1M", "--max-connection-per-server=16",
                          "--bt-max-peers=128", "--bt-tracker-connect-timeout=5", "--bt-tracker-timeout=5",
                          f"--bt-tracker={LIVE_TRACKERS}", target
                      ]
                      proc = await asyncio.create_subprocess_exec(*cmd, stdout=asyncio.subprocess.PIPE, stderr=asyncio.subprocess.STDOUT)
                      download_started, start_time, last_print_time = False, time.time(), time.time()
                      
                      while proc.returncode is None:
                          try:
                              line = await asyncio.wait_for(proc.stdout.readline(), timeout=2.0)
                              if not line: break
                              line_str = line.decode('utf-8', errors='ignore').strip()
                              if line_str and not download_started:
                                  match = re.search(r'\[#\w+\s+([0-9\.]+)([KMGTP]?i?B)/', line_str)
                                  if match and float(match.group(1)) > 0:
                                      download_started = True
                              elapsed = time.time() - start_time
                              if not download_started and elapsed > stuck_timeout:
                                  try: proc.kill()
                                  except Exception: pass
                                  await proc.wait()
                                  break
                          except asyncio.TimeoutError:
                              if not download_started and (time.time() - start_time) > stuck_timeout:
                                  try: proc.kill()
                                  except Exception: pass
                                  await proc.wait()
                                  break
                      await proc.wait()
                      if proc.returncode == 0: return target
                  return None

          async def main():
              targets = glob.glob("torrents/*.torrent")
              if os.path.exists("direct_links.txt"):
                  with open("direct_links.txt", "r") as f:
                      targets.extend([line.strip() for line in f if line.strip()])
              if not targets: return
              os.makedirs("downloads", exist_ok=True)
              sem = asyncio.Semaphore(16)
              tasks = [download_target(t, sem) for t in targets]
              await asyncio.gather(*tasks)

          asyncio.run(main())
          EOF

      - name: Group and Zip Files
        run: |
          python3 - << 'EOF'
          import os, shutil, subprocess, re
          from collections import defaultdict

          folder = "downloads"
          video_ext = ('.mp4', '.mkv', '.avi', '.mov', '.wmv', '.flv', '.webm', '.m4v')
          media_ext = video_ext + ('.srt', '.ass', '.vtt', '.sub')
          max_bytes = 10000 * 1024 * 1024

          def get_dir_size(p):
              return sum(os.path.getsize(os.path.join(dp, f)) for dp, _, fn in os.walk(p) for f in fn)

          def create_7z_group(group_name, file_paths, base_dir, max_bytes_limit):
              group_dir = os.path.join(base_dir, group_name)
              os.makedirs(group_dir, exist_ok=True)
              files_to_move = list(file_paths)
              for p in file_paths:
                  base_stem = os.path.splitext(p)[0]
                  for sub_ext in ('.srt', '.ass', '.vtt', '.sub'):
                      sub_file = base_stem + sub_ext
                      if os.path.exists(sub_file) and sub_file not in files_to_move:
                          files_to_move.append(sub_file)

              for p in files_to_move:
                  dst = os.path.join(group_dir, os.path.basename(p))
                  if p != dst and not os.path.exists(dst): shutil.move(p, dst)
              
              folder_size = get_dir_size(group_dir)
              zip_name = f"{group_name}.zip"
              orig = os.getcwd()
              os.chdir(base_dir)
              cmd = ["7z", "a", "-mx0", "-mmt=on", zip_name, group_name]
              if folder_size > max_bytes_limit:
                  cmd.insert(2, "-v5900m")
              subprocess.run(cmd, check=True)
              os.chdir(orig)
              shutil.rmtree(group_dir)

          if os.path.exists(folder):
              for item in os.listdir(folder):
                  item_path = os.path.join(folder, item)
                  if os.path.isdir(item_path):
                      vids = [os.path.join(r, f) for r, _, files in os.walk(item_path) for f in files if f.lower().endswith(video_ext)]
                      if len(vids) > 3:
                          folder_size = get_dir_size(item_path)
                          orig = os.getcwd()
                          os.chdir(folder)
                          zip_name = f"{item}.zip"
                          cmd = ["7z", "a", "-mx0", "-mmt=on", zip_name, item]
                          if folder_size > max_bytes: cmd.insert(2, "-v5900m")
                          subprocess.run(cmd, check=True)
                          os.chdir(orig)
                          shutil.rmtree(item_path)

          all_videos = [os.path.join(r, f) for r, _, files in os.walk(folder) for f in files if f.lower().endswith(video_ext)]
          series_regex = re.compile(r'(?i)(?:^(.*?)[.\s_-]+)?S(\d{1,2})(?:[EX\-]|\b)')
          series_groups = defaultdict(list)
          unmatched_videos = []

          for vid_path in all_videos:
              vid_name = os.path.basename(vid_path)
              parent_name = os.path.basename(os.path.dirname(vid_path))
              match = series_regex.search(vid_name) or series_regex.search(parent_name)
              if match:
                  group_key = f"{(match.group(1) or 'Season').strip('. -_').lower()}_S{match.group(2)}"
                  series_groups[group_key].append(vid_path)
              else:
                  unmatched_videos.append(vid_path)

          for group_key, vids in series_groups.items():
              if len(vids) > 3:
                  first_stem = os.path.splitext(os.path.basename(vids[0]))[0]
                  create_7z_group(first_stem, vids, folder, max_bytes)
              else:
                  unmatched_videos.extend(vids)

          if len(unmatched_videos) > 3:
              first_stem = os.path.splitext(os.path.basename(unmatched_videos[0]))[0]
              create_7z_group(f"Batch_{first_stem}", unmatched_videos, folder, max_bytes)

          for r, dirs, files in os.walk(folder, topdown=False):
              if r == folder: continue
              for f in files:
                  if f.lower().endswith(media_ext):
                      src, dst = os.path.join(r, f), os.path.join(folder, f)
                      if not os.path.exists(dst): shutil.move(src, dst)
              shutil.rmtree(r, ignore_errors=True)
          EOF

      - name: Upload Files to Filemirage
        run: |
          python3 - << 'EOF'
          import os, subprocess, requests, time, fcntl
          from concurrent.futures import ThreadPoolExecutor

          FILEMIRAGE_API_TOKEN = '9QQH-DGES-CWQZ-FXNV'
          FOLDER_PATH = 'downloads'

          try:
              srv_res = requests.get("https://filemirage.com/api/servers", timeout=10).json()
              SERVER = srv_res['data']['server']
          except Exception as e:
              exit(1)

          def upload_single_file(file_path):
              filename = os.path.basename(file_path)
              curl_cmd = ["curl", "-X", "POST", f"{SERVER}/upload.php", "-H", f"Authorization: Bearer {FILEMIRAGE_API_TOKEN}", "-F", f"file=@{file_path}", "--max-time", "3600"]
              proc = subprocess.Popen(curl_cmd, stdout=subprocess.PIPE, stderr=subprocess.PIPE)
              fd = proc.stderr.fileno()
              fcntl.fcntl(fd, fcntl.F_SETFL, fcntl.fcntl(fd, fcntl.F_GETFL) | os.O_NONBLOCK)
              
              while proc.poll() is None:
                  time.sleep(1)
              proc.communicate()

          if os.path.exists(FOLDER_PATH):
              upload_queue = []
              for root, dirs, files in os.walk(FOLDER_PATH):
                  for filename in files:
                      if not any(ext in filename for ext in [".!qB", ".part", ".aria2"]):
                          upload_queue.append(os.path.join(root, filename))
              if upload_queue:
                  with ThreadPoolExecutor(max_workers=4) as executor:
                      executor.map(upload_single_file, upload_queue)
          EOF
