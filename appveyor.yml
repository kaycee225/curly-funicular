version: v1.0.{build}

image: Ubuntu2204

clone_depth: 1

install:
  - sh: |
      echo "📦 Installing dependencies (7-zip, aria2, Python3)..."
      sudo apt update
      sudo apt install -y p7zip-full aria2 python3 python3-requests python3-pip curl

build_script:
  - sh: |
      echo "📥 Downloading torrents with aria2..."
      mkdir -p downloads 
      python3 download.py

      echo "📦 Running Smart Auto-Group Zipping & Splitting (10 GB limit)..."
      python3 zip_files.py

      echo "📤 Uploading files to Filemirage via Memory-Safe Curl..."
      python3 upload.py

test: off
